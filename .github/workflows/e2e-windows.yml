name: e2e-windows
# 在全新的 Windows 上，按普通用户的方式（irm 网址 | 安装）从零安装 Purrge：
# 没有 Python、没有 Node.js → 自动安装 → 选 WorkBuddy → 后台任务 → 扫描 → 审查页面 → 清理进回收站
on:
  workflow_dispatch:
  push:
    branches: [master, v0.3-dev]
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 从零安装（模拟没有 Python / Node.js 的电脑）
        shell: powershell
        env:
          PURRGE_BRANCH: ${{ github.sha }}
          PURRGE_YES: "1"
          PURRGE_FORCE_NO_PY: "1"
        run: |
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          $s = irm "https://raw.githubusercontent.com/RabbittuX/purrge/${{ github.sha }}/install.ps1"
          & ([scriptblock]::Create($s)) --engine workbuddy --threshold 15 --yes
      - name: 检查安装结果
        shell: pwsh
        run: |
          $p = "$env:LOCALAPPDATA\Microsoft\WindowsApps\purrge.cmd"
          if (-not (Test-Path $p)) { throw "没有 purrge 命令" }
          & $p version
          & $p status
          $st = (& $p status | Out-String | ConvertFrom-Json)
          if ($st.monitor -ne "运行中") { throw "后台任务没有注册" }
          schtasks /query /fo LIST | Select-String -Pattern "purrge" -SimpleMatch
          $cfg = Get-Content "$env:USERPROFILE\.purrge\config.json" -Raw | ConvertFrom-Json
          "WorkBuddy 命令行：$($cfg.workbuddyPath)"
          if (-not $cfg.workbuddyPath -or -not (Test-Path $cfg.workbuddyPath)) { throw "没有找到 WorkBuddy 命令行" }
          & $cfg.workbuddyPath --version
          Get-Content "$env:USERPROFILE\.purrge\config.json"
      - name: 扫描 + 审查页面 + 清理进回收站
        shell: pwsh
        run: |
          $p = "$env:LOCALAPPDATA\Microsoft\WindowsApps\purrge.cmd"
          $junk = "$env:TEMP\purrge-e2e-junk"; New-Item -ItemType Directory -Force $junk | Out-Null
          1..5 | ForEach-Object { [IO.File]::WriteAllBytes("$junk\f$_.bin", (New-Object byte[] (20MB))) }
          $t0 = Get-Date
          $proc = Start-Process -FilePath $p -ArgumentList "run", "--no-open" -PassThru -WindowStyle Hidden `
                    -RedirectStandardOutput "$env:TEMP\run.out" -RedirectStandardError "$env:TEMP\run.err"
          $url = $null
          for ($i = 0; $i -lt 120 -and -not $url; $i++) {
            Start-Sleep 5
            $f = Get-ChildItem "$env:USERPROFILE\.purrge\runs\*\review-url.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $url = Get-Content $f.FullName -Raw }
            if ($proc.HasExited -and -not $url) { break }
          }
          "用时 $([int]((Get-Date) - $t0).TotalSeconds) 秒"
          Get-Content "$env:TEMP\run.out", "$env:TEMP\run.err" -Encoding UTF8 -ErrorAction SilentlyContinue
          if (-not $url) { throw "扫描没有完成" }
          $token = ($url -split "token=")[1].Trim()
          $base = ($url -split "/\?")[0]
          $page = Invoke-WebRequest "$url" -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "审查页面打不开" }
          $r = Invoke-RestMethod "$base/api/review" -Headers @{ "X-DG-Token" = $token }
          "共 $($r.review.items.Count) 项，判断来源：$($r.review.judgedBy)"
          $r.review.items | Select-Object -First 8 | ForEach-Object { "{0,-9} {1:N1}MB  {2}" -f $_.tier, ($_.sizeBytes / 1MB), $_.path }
          $item = $r.review.items | Where-Object { $_.tier -eq "primary" } | Select-Object -First 1
          if ($item) {
            $res = Invoke-RestMethod "$base/api/clean" -Method Post -Headers @{ "X-DG-Token" = $token } -ContentType "application/json" -Body (@{ ids = @($item.id) } | ConvertTo-Json)
            "清理：$($item.path) → $($res.results[0].status)，释放 $([math]::Round($res.freedBytes / 1MB, 1)) MB"
          }
          Invoke-RestMethod "$base/api/close" -Method Post -Headers @{ "X-DG-Token" = $token } | Out-Null
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: 弹窗样式截图（浅色 / 深色）+ 原生通知
        shell: pwsh
        run: |
          $p = "$env:LOCALAPPDATA\Microsoft\WindowsApps\purrge.cmd"
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty $k AppsUseLightTheme 1 -Type DWord
          & $p popup --snapshot "$env:RUNNER_TEMP\alert-light.png"
          Set-ItemProperty $k AppsUseLightTheme 0 -Type DWord
          & $p popup --snapshot "$env:RUNNER_TEMP\alert-dark.png"
          if (-not (Test-Path "$env:RUNNER_TEMP\alert-light.png") -or -not (Test-Path "$env:RUNNER_TEMP\alert-dark.png")) { throw "提醒窗没有画出来" }
          & $p popup --notify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-${{ matrix.os }}
          path: ${{ runner.temp }}/alert-*.png
      - name: 卸载干净
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Microsoft\WindowsApps\purrge.cmd" uninstall --purge
          if ($LASTEXITCODE -ne 0) { throw "卸载命令返回 $LASTEXITCODE" }
          Start-Sleep 5                                  # purrge.cmd 由后台小任务在命令结束后删除
          $left = @()
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\purrge.cmd") { $left += "purrge.cmd" }
          if (Test-Path "$env:USERPROFILE\.purrge") { $left += ".purrge" }
          if (Test-Path "HKCU:\Software\Classes\AppUserModelId\RabbittuX.Purrge") { $left += "通知身份" }
          schtasks /Query /TN "Purrge-com.rabbittux.purrge" 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { $left += "定时任务" }
          if ($left) { throw "卸载后还留着：$($left -join '、')" }
          "卸载干净"
          exit 0                                         # 上面查定时任务"不存在"时 schtasks 返回 1，那正是想要的结果
